name: Scrape

on:
  workflow_dispatch:

env:
  UV_PYTHON: '3.13'  # Fiona has no ready-made files for newer Pythons yet

jobs:
  scrape:
    name: Scrape
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - id: install-uv
        name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: 'uv.lock'

      - name: Setup
        run: uv sync
        shell: bash

      - id: get-all
        name: Get all events
        run: uv run nwswwa all > data/all.json
        shell: bash

      - id: get-hazards
        name: Get hazards
        run: uv run nwswwa hazards > data/hazards.json
        shell: bash

      - id: get-warnings
        name: Get warnings
        run: uv run nwswwa warnings > data/warnings.json
        shell: bash

      - name: Datestamp
        run: date > data/timestamp.txt
        shell: bash

      - id: commit
        name: Commit results
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "actions@github.com"
          git config pull.rebase false
          git status
          git pull origin $GITHUB_REF
          git add ./data
          git commit -m "Scrape" && git push || true
        shell: bash
