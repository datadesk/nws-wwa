[build-system]
requires = ["setuptools>=77", "setuptools_scm>=8"]
build-backend = "setuptools.build_meta"

[project]
name = "nws-wwa"
dynamic = ["version"]
requires-python = ">=3.11"
dependencies = [
    "click",
    "pyogrio",
    "geojson",
    "requests",
]
authors = [{ name = "Ben Welsh", email = "b@palewi.re" }]
description = "Download watch, warning and advisory data from the National Weather Service"
keywords = ["weather", "nws", "noaa", "alerts", "geojson", "data"]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]

[project.urls]
Documentation = "https://palewi.re/docs/nws-wwa/"
Source = "https://github.com/datadesk/nws-wwa"
Issues = "https://github.com/datadesk/nws-wwa/issues"
Maintainer = "https://github.com/datadesk"

[project.scripts]
nwswwa = "nws_wwa.cli:cmd"

[dependency-groups]
dev = [
    "pre-commit",
    "ruff",
    "setuptools-scm",
    "twine",
    "ty",
]
test = [
    "pytest",
    "pytest-cov",
]
docs = [
    "myst-parser",
    "sphinx",
    "sphinx-autobuild",
    "sphinx-palewire-theme",
]

[tool.setuptools]
packages = ["nws_wwa"]

[tool.setuptools.package-data]
nws_wwa = ["py.typed"]

[tool.setuptools_scm]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers", "-m", "not live"]
markers = [
    "live: talks to the real National Weather Service website, so it can be slow or fail when NWS is down",
]

[tool.coverage.run]
source = ["nws_wwa"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "\\.\\.\\.$",
]

[tool.ty.environment]
python-version = "3.11"

[tool.ty.src]
include = ["nws_wwa"]
